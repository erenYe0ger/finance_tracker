name: finance_tracker
description: "AI Personal Finance Tracker - Android-first mobile app with FastAPI backend"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^2.0.0

  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Networking
  dio: ^5.4.3+1

  # Secure Storage
  flutter_secure_storage: ^11.2.0

  # Navigation
  go_router: ^18.1.4

  # Formatting & Localization
  intl: ^0.20.3

  # Charts & Visualization
  fl_chart: ^1.3.1

  # Code Generation (Freezed + JSON)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Utilities
  equatable: ^3.0.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation Tools
  build_runner: ^2.4.11
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
